# ============================================================================
# Kandes.shop - docker-compose.yml (D66)
# File này được dùng bởi self-hosted runner trên EC2 để khởi động containers.
# Image được pull từ ghcr.io, KHÔNG build trên EC2.
#
# Usage (trên EC2 trong /opt/kandes):
#   docker compose pull        # pull image mới nhất
#   docker compose up -d       # khởi động
#   docker compose logs -f app # xem log
#
# Setup một lần:
#   mkdir -p /opt/kandes && cd /opt/kandes
#   curl -O https://raw.githubusercontent.com/Kandesfx/KandesAIShop/main/docker-compose.yml
#   curl -O https://raw.githubusercontent.com/Kandesfx/KandesAIShop/main/nginx.conf
#   Tạo /opt/kandes/.env (xem EC2-SETUP.md)
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Kandes Next.js app (pulled from GHCR)
  # --------------------------------------------------------------------------
  app:
    # IMAGE env var allows rollback to a specific SHA tag (see EC2-SETUP.md §6).
    # Default: latest. Override in /opt/kandes/.env to rollback:
    #   IMAGE=ghcr.io/kandesfx/kandesaishop:<sha>
    image: ${IMAGE:-ghcr.io/kandesfx/kandesaishop:latest}
    container_name: kandes-app
    restart: unless-stopped
    # Chạy bằng non-root user (UID 1001) đã có sẵn trong image
    user: "1001:1001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on: []
    # Network được tự động tạo bởi docker compose
    # Cho phép chạy prisma migrate deploy bằng cách:
    #   docker compose run --rm app npx prisma migrate deploy
    # KHÔNG mount source code vào container (image đã có code bên trong)

  # --------------------------------------------------------------------------
  # Nginx reverse proxy (TLS termination + reverse proxy)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: kandes-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Static nginx config (đặt cùng thư mục /opt/kandes/nginx.conf)
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS certs (Let's Encrypt hoặc self-signed)
      - ./certs:/etc/nginx/certs:ro
      # Optional: cache + logs
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    depends_on: []  # D70: No db dependency — RDS Postgres via DATABASE_URL

  # --------------------------------------------------------------------------
  # PostgreSQL — D70 (2026-08-10): RDS Postgres là primary DB.
  # Container postgres bên dưới được comment nhưng GIỮ LẠI để rollback khẩn cấp
  # (nếu RDS down hoặc cần test local). Uncomment nếu cần fallback.
  # RDS endpoint: kandes-db.crmca6kou3xz.ap-southeast-1.rds.amazonaws.com:5432
  # DATABASE_URL phải trỏ RDS, KHÔNG trỏ 'db:5432'.
  # --------------------------------------------------------------------------
  # db:
  #   image: postgres:16-alpine
  #   container_name: kandes-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=${POSTGRES_USER:-kandes}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kandes_dev_2026}
  #     - POSTGRES_DB=${POSTGRES_DB:-kandes_shop}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kandes} -d ${POSTGRES_DB:-kandes_shop}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s
  #   networks:
  #     - kandes_default

# --------------------------------------------------------------------------
# Volumes (persistent) — D70: postgres-data unused (RDS primary), kept for rollback
# --------------------------------------------------------------------------
volumes:
  # postgres-data:
  #   name: kandes-postgres-data
  nginx-cache:
    name: kandes-nginx-cache
  nginx-logs:
    name: kandes-nginx-logs

# Network được tự động tạo bởi docker compose v2 (không cần khai báo thủ công)
