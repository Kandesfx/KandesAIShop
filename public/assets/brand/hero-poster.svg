<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0C1018" />
      <stop offset="60%" stop-color="#05060A" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="accent2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6A2C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.10" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#00E5FF" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)" />
  <rect width="1920" height="1080" fill="url(#grid)" />
  <ellipse cx="640" cy="380" rx="700" ry="380" fill="url(#accent1)" />
  <ellipse cx="1320" cy="700" rx="600" ry="320" fill="url(#accent2)" />
  <!-- subtle horizon line -->
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#00E5FF" stroke-opacity="0.04" stroke-width="1" />
</svg>