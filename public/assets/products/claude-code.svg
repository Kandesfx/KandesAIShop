<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-claude" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0A08"/>
      <stop offset="50%" stop-color="#1A120B"/>
      <stop offset="100%" stop-color="#080605"/>
    </linearGradient>
    <linearGradient id="orange-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow-claude" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg-claude)" rx="16"/>
  <path d="M0 75 H600 M0 150 H600 M0 225 H600 M0 300 H600 M0 375 H600 M75 0 V450 M150 0 V450 M225 0 V450 M300 0 V450 M375 0 V450 M450 0 V450 M525 0 V450" stroke="#292017" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="195" r="110" fill="#D97706" opacity="0.1" filter="url(#glow-claude)"/>
  <g transform="translate(300, 190)">
    <!-- Anthropic / Claude Starburst Shape -->
    <path d="M-40 -40 L0 -15 L40 -40 L15 0 L40 40 L0 15 L-40 40 L-15 0 Z" fill="url(#orange-glow)" filter="url(#glow-claude)"/>
    <circle cx="0" cy="0" r="14" fill="#0D0A08" stroke="#F59E0B" stroke-width="2.5"/>
  </g>
  <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">CLAUDE CODE</text>
  <text x="300" y="355" font-family="'Courier New', monospace" font-weight="600" font-size="12" fill="#F59E0B" text-anchor="middle" letter-spacing="0.25em">[ ANTHROPIC AI AGENT ]</text>
  <rect x="220" y="380" width="160" height="24" rx="4" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1"/>
  <text x="300" y="396" font-family="'Courier New', monospace" font-weight="700" font-size="10" fill="#F59E0B" text-anchor="middle" letter-spacing="0.15em">SONNET 3.5 &amp; OPUS</text>
</svg>