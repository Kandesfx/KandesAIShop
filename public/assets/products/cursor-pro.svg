<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0070F3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)" rx="16"/>
  <path d="M0 75 H600 M0 150 H600 M0 225 H600 M0 300 H600 M0 375 H600 M75 0 V450 M150 0 V450 M225 0 V450 M300 0 V450 M375 0 V450 M450 0 V450 M525 0 V450" stroke="#1E293B" stroke-width="1" opacity="0.4"/>
  <circle cx="300" cy="200" r="110" fill="#00F0FF" opacity="0.08" filter="url(#glow)"/>
  <g transform="translate(300, 190)">
    <!-- Cursor 3D Icon Box -->
    <path d="M0 -60 L52 -30 L52 30 L0 60 L-52 30 L-52 -30 Z" fill="#0D1527" stroke="url(#cyan-glow)" stroke-width="3.5" filter="url(#glow)"/>
    <path d="M0 -60 L0 60 M0 0 L52 -30 M0 0 L-52 -30 M0 0 L0 60" stroke="#00F0FF" stroke-width="2" opacity="0.7"/>
    <!-- Cursor Arrow -->
    <path d="M-15 -10 L15 15 L2 18 L-2 28 L-10 24 L-6 16 Z" fill="#00F0FF" filter="url(#glow)"/>
  </g>
  <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">CURSOR PRO</text>
  <text x="300" y="355" font-family="'Courier New', monospace" font-weight="600" font-size="12" fill="#00F0FF" text-anchor="middle" letter-spacing="0.25em">[ AI-POWERED CODE EDITOR ]</text>
  <rect x="235" y="380" width="130" height="24" rx="4" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1"/>
  <text x="300" y="396" font-family="'Courier New', monospace" font-weight="700" font-size="10" fill="#00F0FF" text-anchor="middle" letter-spacing="0.15em">400 REQ / DAY</text>
</svg>