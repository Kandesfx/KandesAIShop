    <path d="M0 -45 C20 -45 40 -30 40 -10 C40 5 25 20 5 35 C-15 50 -35 30 -35 15 C-35 -5 -15 -35 0 -45 Z" fill="none" stroke="url(#green-glow)" stroke-width="4.5" filter="url(#glow-gpt)"/>
    <path d="M-30 -25 C-10 -45 20 -40 35 -20 C45 -5 35 25 15 35 C-5 45 -30 35 -35 15" fill="none" stroke="#34D399" stroke-width="3" opacity="0.8"/>
  </g>
  <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">CODEX GPT</text>
  <text x="300" y="355" font-family="'Courier New', monospace" font-weight="600" font-size="12" fill="#10B981" text-anchor="middle" letter-spacing="0.25em">[ OPENAI CHATGPT &amp; O1 ]</text>
