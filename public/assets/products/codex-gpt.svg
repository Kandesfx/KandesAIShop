      <stop offset="0%" stop-color="#060E0A"/>
      <stop offset="50%" stop-color="#0D1F17"/>
      <stop offset="100%" stop-color="#040A07"/>
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
