<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0C1B33"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="ds-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow-ds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg-ds)" rx="16"/>
  <path d="M0 75 H600 M0 150 H600 M0 225 H600 M0 300 H600 M0 375 H600 M75 0 V450 M150 0 V450 M225 0 V450 M300 0 V450 M375 0 V450 M450 0 V450 M525 0 V450" stroke="#162D50" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="195" r="110" fill="#38BDF8" opacity="0.1" filter="url(#glow-ds)"/>
  <g transform="translate(300, 190)">
