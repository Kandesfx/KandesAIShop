    <path d="M-45 0 C-40 -35 10 -40 35 -20 C50 -5 45 25 15 35 C-15 45 -40 25 -45 0 Z" fill="#0C1A30" stroke="url(#ds-glow)" stroke-width="3.5" filter="url(#glow-ds)"/>
    <circle cx="20" cy="-12" r="4" fill="#38BDF8"/>
  </g>
  <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">DEEPSEEK R1</text>
  <text x="300" y="355" font-family="'Courier New', monospace" font-weight="600" font-size="12" fill="#38BDF8" text-anchor="middle" letter-spacing="0.25em">[ OPEN REASONING MODEL ]</text>
  <rect x="220" y="380" width="160" height="24" rx="4" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-width="1"/>
