<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-windsurf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C10"/>
      <stop offset="50%" stop-color="#0A1D24"/>
      <stop offset="100%" stop-color="#04090C"/>
    </linearGradient>
    <linearGradient id="teal-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="glow-windsurf" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg-windsurf)" rx="16"/>
  <path d="M0 75 H600 M0 150 H600 M0 225 H600 M0 300 H600 M0 375 H600 M75 0 V450 M150 0 V450 M225 0 V450 M300 0 V450 M375 0 V450 M450 0 V450 M525 0 V450" stroke="#133642" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="195" r="110" fill="#00F0FF" opacity="0.1" filter="url(#glow-windsurf)"/>
  <g transform="translate(300, 190)">
    <!-- Windsurf Wave Cascade -->
    <path d="M-40 20 C-30 -20 -10 -40 20 -40 C5 -10 15 10 40 20 C20 40 -10 40 -40 20 Z" fill="url(#teal-glow)" filter="url(#glow-windsurf)"/>
  </g>
  <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">WINDSURF CASCADE</text>
  <text x="300" y="355" font-family="'Courier New', monospace" font-weight="600" font-size="12" fill="#00F0FF" text-anchor="middle" letter-spacing="0.25em">[ CODEIUM AGENTIC IDE ]</text>
  <rect x="235" y="380" width="130" height="24" rx="4" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1"/>
  <text x="300" y="396" font-family="'Courier New', monospace" font-weight="700" font-size="10" fill="#00F0FF" text-anchor="middle" letter-spacing="0.15em">PRO UNLIMITED</text>
</svg>