    <path d="M-45 10 C-45 -25 -25 -45 0 -45 C25 -45 45 -25 45 10 C45 35 25 45 0 45 C-25 45 -45 35 -45 10 Z" fill="#130D22" stroke="url(#purple-glow)" stroke-width="4" filter="url(#glow-copilot)"/>
    <ellipse cx="-16" cy="5" rx="8" ry="12" fill="#8B5CF6"/>
    <ellipse cx="16" cy="5" rx="8" ry="12" fill="#8B5CF6"/>
  </g>
  <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1em">GITHUB COPILOT</text>
  <text x="300" y="355" font-family="'Courier New', monospace" font-weight="600" font-size="12" fill="#C084FC" text-anchor="middle" letter-spacing="0.25em">[ ENTERPRISE AI PAIR ]</text>
