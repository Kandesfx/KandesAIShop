name: Deploy to AWS EC2 (Self-hosted)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}

jobs:
  build:
    name: Build Check
    runs-on: [self-hosted, kandes]
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Build + Deploy (Self-hosted EC2)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, kandes]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Apply DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd /opt/kandes
          docker run --rm \
            --network kandes_default \
            -e DATABASE_URL="$DATABASE_URL" \
            kandes-shop:latest \
            npx prisma migrate deploy

      - name: Pull latest image (or build local if not pushed)
        run: |
          cd /opt/kandes
          # Try pull first; fallback to local build
          docker pull kandes-shop:latest 2>/dev/null || true
          # If pulled image exists use it; otherwise build from local code
          if ! docker image inspect kandes-shop:latest > /dev/null 2>&1; then
            echo "Building image locally from /opt/kandes source..."
            docker build -t kandes-shop:latest /opt/kandes
          fi

      - name: Restart containers
        run: |
          cd /opt/kandes
          export IMAGE_TAG=latest
          docker compose up -d --no-deps app
          docker compose up -d --no-deps nginx

      - name: Health check
        run: |
          sleep 15
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo "000")
            echo "Health check attempt $i: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Deploy successful"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Smoke tests
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.PROD_DOMAIN }}/)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: homepage returned $STATUS"
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.PROD_DOMAIN }}/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: health endpoint returned $STATUS"
            exit 1
          fi
          echo "Smoke tests passed"

      - name: Notify success
        if: success() && env.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deploy success
            Commit: ${{ github.event.head_commit.message }}
            SHA: ${{ github.sha }}
            Domain: https://${{ secrets.PROD_DOMAIN }}

      - name: Notify failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Deploy FAILED
            Commit: ${{ github.event.head_commit.message }}
            SHA: ${{ github.sha }}
            Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
