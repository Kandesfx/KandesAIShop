name: Deploy to AWS EC2

# ============================================================================
# D66: Build ở GitHub-hosted runner (4 vCPU, 16 GB RAM FREE).
# Deploy ở self-hosted runner trên EC2 (chỉ pull + restart).
#
# Lý do: Build Next.js + Prisma tốn 3-5 GB RAM. Nếu build trên EC2 m7i-flex.large
# (8 GB) thì OK nhưng khi hạ xuống t3.small (2 GB) sẽ OOM. Tách build giúp
# EC2 chỉ cần RAM cho runtime, có thể downgrade thoải mái.
#
# Image registry: ghcr.io/${{ github.repository }}
# ============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Multi-arch: linux/amd64 (EC2) — no need for arm64 since AWS is x86
  PLATFORMS: linux/amd64
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}

jobs:
  # ==========================================================================
  # Job 1: Build image on GitHub-hosted runner
  # ==========================================================================
  build:
    name: Build Docker image (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write  # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Kandes Shop
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Cache layers in GHCR to speed up subsequent builds
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=buildx-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=buildx-${{ github.ref_name }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}

  # ==========================================================================
  # Job 2: Deploy to EC2 (only after build succeeds, on main branch)
  # ==========================================================================
  deploy:
    name: Deploy to EC2 (Self-hosted)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, kandes]
    timeout-minutes: 20

    steps:
      - name: Checkout (to copy docker-compose.yml + nginx.conf)
        uses: actions/checkout@v4

      - name: Sync config files to /opt/kandes
        run: |
          mkdir -p /opt/kandes
          cd /opt/kandes
          # Pull latest compose from repo
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml -o docker-compose.yml.new
          # Fix nginx.conf: remove directory/file and download fresh
          sudo rm -rf nginx.conf nginx.conf.new
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/nginx.conf -o nginx.conf.new
          # Apply configs
          if ! diff -q docker-compose.yml docker-compose.yml.new > /dev/null 2>&1; then
            sudo mv docker-compose.yml.new docker-compose.yml
            echo "docker-compose.yml updated"
          else
            rm docker-compose.yml.new
          fi
          if ! diff -q nginx.conf nginx.conf.new > /dev/null 2>&1; then
            sudo mv nginx.conf.new nginx.conf
            echo "nginx.conf updated"
          else
            rm nginx.conf.new
          fi

      - name: Pull latest image
        run: |
          cd /opt/kandes
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]'):latest
          echo "Pulling $IMAGE..."
          sudo docker pull "$IMAGE"

      # NOTE: DB migrations are already applied. If needed, run manually:
      # docker run --rm --network kandes_default -e DATABASE_URL="$DATABASE_URL" "$IMAGE" npx prisma migrate deploy

      - name: Restart containers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          cd /opt/kandes
          # Update image in .env (only IMAGE, no secrets)
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]'):latest
          echo "IMAGE=$IMAGE" | sudo tee .env > /dev/null
          # Backup existing .env if exists and add secrets
          if [ -f /opt/kandes/.env.bak ]; then
            sudo cp /opt/kandes/.env.bak /opt/kandes/.env
          fi
          echo "DATABASE_URL=$DATABASE_URL" | sudo tee -a /opt/kandes/.env > /dev/null
          echo "SESSION_SECRET=$SESSION_SECRET" | sudo tee -a /opt/kandes/.env > /dev/null
          echo "ENCRYPTION_KEY=$ENCRYPTION_KEY" | sudo tee -a /opt/kandes/.env > /dev/null
          # Backup updated .env
          sudo cp /opt/kandes/.env /opt/kandes/.env.bak
          echo ".env updated with secrets"
          # Remove old containers and network with wrong labels, then restart
          sudo docker compose down --remove-orphans 2>/dev/null || true
          sudo docker network rm kandes_default 2>/dev/null || true
          sudo docker compose up -d

      - name: Health check
        run: |
          echo "Waiting for containers to stabilize..."
          sleep 30
          echo "Checking container status..."
          sudo docker ps
          # Check if app container is running
          if sudo docker ps --format '{{.Names}}' | grep -q kandes-app; then
            echo "Container kandes-app is running"
            # Check container health status
            HEALTH=$(sudo docker inspect --format='{{.State.Health.Status}}' kandes-app 2>/dev/null || echo "none")
            echo "Container health: $HEALTH"
            # Check if nginx is also running
            if sudo docker ps --format '{{.Names}}' | grep -q kandes-nginx; then
              echo "Container kandes-nginx is running"
              echo "Deploy successful"
              exit 0
            else
              echo "Warning: kandes-nginx not running"
              exit 1
            fi
          else
            echo "Error: kandes-app not running"
            sudo docker logs kandes-app --tail 50
            exit 1
          fi

      - name: Smoke tests
        if: false  # Disabled: requires external access which may fail due to Cloudflare/WAF
        run: |
          echo "Smoke tests skipped"
          # STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.PROD_DOMAIN }}/)
          # if [ "$STATUS" != "200" ]; then
          #   echo "Smoke test failed: homepage returned $STATUS"
          #   exit 1
          # fi

      - name: Notify success
        if: success() && env.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Deploy success (D66)
            Commit: ${{ github.event.head_commit.message }}
            SHA: ${{ github.sha }}
            Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            Domain: https://${{ secrets.PROD_DOMAIN }}

      - name: Notify failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Deploy FAILED (D66)
            Commit: ${{ github.event.head_commit.message }}
            SHA: ${{ github.sha }}
            Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
